name: MAP-001 public small-area geodata (ephemeral artifact)

on:
  push:
    branches:
      - feature/map001-public-data-fallback
    paths:
      - 'tools/map001/**'
      - '.github/workflows/map001-public-geodata.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  small-source-fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout exact source branch
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install small geospatial dependencies
        run: python -m pip install --disable-pip-version-check rasterio==1.4.3 shapely==2.1.2
      - name: One bounded OSM request and Copernicus COG crop
        id: acquire
        continue-on-error: true
        run: python tools/map001/fetch_public_inputs.py reports/MAP-001/artifact
      - name: Publish logs and bounded input files (not Git commits)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MAP001-Pripyat-source-inputs
          path: reports/MAP-001/artifact/
          retention-days: 3
          if-no-files-found: error
      - name: Report partial source failures honestly
        if: steps.acquire.outcome != 'success'
        run: |
          echo "PARTIAL/BLOCKED: see SOURCE_MANIFEST.json in artifact; no map or local Global Mapper run was verified"
          exit 1
